<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Buscando Milhão</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <header class="bg-white shadow">
        <div class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8 flex items-center justify-between">
            <div>
                <h1 class="text-3xl font-bold text-gray-900">Dashboard de Prospecção</h1>
                <p class="text-sm text-gray-500">Status do Servidor: <span id="status" class="text-green-500">Online</span></p>
            </div>
            <div id="spinner" class="hidden animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-blue-600"></div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
        <!-- Métricas -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-white p-4 rounded shadow">
                <p class="text-sm text-gray-500">Total</p>
                <p id="totalLeads" class="text-2xl font-bold">0</p>
            </div>
            <div class="bg-white p-4 rounded shadow">
                <p class="text-sm text-gray-500">Pendentes</p>
                <p id="pendingLeads" class="text-2xl font-bold">0</p>
            </div>
            <div class="bg-white p-4 rounded shadow">
                <p class="text-sm text-gray-500">Contatados</p>
                <p id="contactedLeads" class="text-2xl font-bold">0</p>
            </div>
            <div class="bg-white p-4 rounded shadow">
                <p class="text-sm text-gray-500">Respondidos</p>
                <p id="repliedLeads" class="text-2xl font-bold">0</p>
            </div>
        </div>

        <!-- Ação -->
        <div class="mb-6">
            <button id="triggerCadence" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded shadow transition duration-200">
                Forçar Execução
            </button>
        </div>

        <!-- Tabela -->
        <div class="bg-white shadow rounded overflow-hidden">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Username</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Pipeline</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                    </tr>
                </thead>
                <tbody id="leadsTable" class="bg-white divide-y divide-gray-200">
                </tbody>
            </table>
        </div>
    </main>

    <script>
        async function fetchData() {
            const spinner = document.getElementById('spinner');
            spinner.classList.remove('hidden');
            
            try {
                const res = await fetch('/api/leads');
                const leads = await res.json();
                
                // Métricas
                document.getElementById('totalLeads').innerText = leads.length;
                document.getElementById('pendingLeads').innerText = leads.filter(l => l.pipelineState === 'discovered').length;
                document.getElementById('contactedLeads').innerText = leads.filter(l => l.pipelineState === 'contacted').length;
                document.getElementById('repliedLeads').innerText = leads.filter(l => l.pipelineState === 'replied').length;

                // Tabela
                const tbody = document.getElementById('leadsTable');
                tbody.innerHTML = '';
                leads.forEach(lead => {
                    const tr = document.createElement('tr');
                    
                    // Definição de cores baseadas no status
                    const pipelineColor = lead.pipelineState === 'replied' ? 'bg-green-100 text-green-800' : 
                                         lead.pipelineState === 'contacted' ? 'bg-blue-100 text-blue-800' : 'bg-yellow-100 text-yellow-800';
                    const channelColor = 'bg-gray-100 text-gray-800';

                    tr.innerHTML = `
                        <td class="px-6 py-4 whitespace-nowrap font-medium text-gray-900">@${lead.username}</td>
                        <td class="px-6 py-3 whitespace-nowrap"><span class="px-2 py-1 rounded-full text-xs font-semibold ${pipelineColor}">${lead.pipelineState}</span></td>
                        <td class="px-6 py-3 whitespace-nowrap"><span class="px-2 py-1 rounded-full text-xs font-semibold ${channelColor}">${lead.channelState}</span></td>
                    `;
                    tbody.appendChild(tr);
                });
            } finally {
                spinner.classList.add('hidden');
            }
        }

        document.getElementById('triggerCadence').addEventListener('click', async (e) => {
            const btn = e.target;
            btn.innerText = 'Executando Cadência...';
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');

            try {
                await fetch('/api/trigger', { method: 'POST' });
                Toastify({
                    text: "Cadência iniciada em background! Acompanhe a tabela.",
                    duration: 3000,
                    backgroundColor: "linear-gradient(to right, #00b09b, #96c93d)",
                }).showToast();
            } catch (err) {
                alert('Erro ao disparar cadência.');
            } finally {
                btn.innerText = 'Forçar Execução';
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        });

        fetchData();
        setInterval(fetchData, 30000); // Atualiza a cada 30s
    </script>
</body>
</html>
